# ==========================
# ===  General settings  ===
# ==========================

set -g default-terminal "screen-256color"
set -g history-limit 50000
set -g buffer-limit 20
set -sg escape-time 0
set -g display-time 1500
set -g remain-on-exit off
set -g repeat-time 300
setw -g allow-rename off
setw -g automatic-rename off
setw -g aggressive-resize on

# Change prefix key to C-a, easier to type, same to "screen"
unbind C-b
set -g prefix C-a

# Set parent terminal title to reflect current window in tmux session 
set -g set-titles on
set -g set-titles-string "#I:#W"

# Start index of window/pane with 1, because we're humans, not computers
set -g base-index 1
setw -g pane-base-index 1

# Enable mouse support
set -g mouse on

# Thin blinking bar cursor, same as zsh prompt in Ghostty. Apps that set their own
# cursor (e.g. vim block in normal mode) still can, and it's restored when they reset it
set -g cursor-style blinking-bar
set -as terminal-features ',*:cstyle'

# Shift+Enter for a newline in Claude Code / Codex text boxes.
# tmux 3.4 sends plain Enter for Shift+Enter by default, and can't speak the kitty
# keyboard protocol these apps use to tell them apart outside tmux. So: have the outer
# terminal report modified keys (extended keys), and send Shift+Enter to the app in
# CSI u form ("ESC [13;2u"), which both understand. Shells get a plain Enter.
set -s extended-keys on
set -as terminal-features ',*:extkeys'
bind -n S-Enter if -F '#{m/r:^-?(zsh|bash|fish|sh|dash|ksh|tcsh)$,#{pane_current_command}}' \
    'send-keys Enter' \
    'send-keys -H 1b 5b 31 33 3b 32 75'


# ==========================
# ===   Key bindings     ===
# ==========================

# Unbind default key bindings, we're going to override
unbind "\$" # rename-session
unbind ,    # rename-window
unbind %    # split-window -h
unbind '"'  # split-window
unbind \}    # swap-pane -D
unbind \{    # swap-pane -U
unbind [    # paste-buffer
unbind ]    
unbind "'"  # select-window
unbind n    # next-window
unbind p    # previous-window
unbind l    # last-window
unbind M-n  # next window with alert
unbind M-p  # next window with alert
unbind o    # focus thru panes
unbind &    # kill-window
unbind "#"  # list-buffer 
unbind =    # choose-buffer
unbind z    # zoom-pane
unbind M-Up  # resize 5 rows up
unbind M-Down # resize 5 rows down
unbind M-Right # resize 5 rows right
unbind M-Left # resize 5 rows left


# Edit configuration and reload
bind C-e new-window -n 'tmux.conf' "sh -c '\${EDITOR:-vim} ~/.tmux.conf && tmux source ~/.tmux.conf && tmux display \"Config reloaded\"'"

# Reload tmux configuration 
bind C-r source-file ~/.tmux.conf \; display "Config reloaded"

# new window and retain cwd
bind c new-window -c "#{pane_current_path}"

# Prompt to rename window right after it's created
set-hook -g after-new-window 'command-prompt -I "#{window_name}" "rename-window '%%'"'

# Rename session and window
bind r command-prompt -I "#{window_name}" "rename-window '%%'"
bind R command-prompt -I "#{session_name}" "rename-session '%%'"

# Split panes
bind | split-window -h -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"

# Prefix-less pane shortcuts (Option/Alt key)
# Option+d: new pane to the right, Option+Shift+d: new pane below, Option+w: close pane
bind -n M-d split-window -h -c "#{pane_current_path}"
bind -n M-D split-window -v -c "#{pane_current_path}"
bind -n M-w kill-pane

# Option+Shift+Arrow: move current pane in that direction (focus follows it)
bind -n M-S-Up    swap-pane -d -t '{up-of}'
bind -n M-S-Down  swap-pane -d -t '{down-of}'
bind -n M-S-Left  swap-pane -d -t '{left-of}'
bind -n M-S-Right swap-pane -d -t '{right-of}'

# Select pane and windows
bind -r C-[ previous-window
bind -r C-] next-window
bind -r [ select-pane -t :.-
bind -r ] select-pane -t :.+
bind -r Tab last-window   # cycle thru MRU tabs
bind -r C-o swap-pane -D

# Zoom pane
bind + resize-pane -Z

# Link window
bind L command-prompt -p "Link window from (session:window): " "link-window -s %% -a"

# Swap panes back and forth with 1st pane
# When in main-(horizontal|vertical) layouts, the biggest/widest panel is always @1
bind \\ if '[ #{pane_index} -eq 1 ]' \
     'swap-pane -s "!"' \
     'select-pane -t:.1 ; swap-pane -d -t 1 -s "!"'

# Kill pane/window/session shortcuts
bind x kill-pane
bind X kill-window
bind C-x confirm-before -p "kill other windows? (y/n)" "kill-window -a"
bind Q confirm-before -p "kill-session #S? (y/n)" kill-session

# Merge session with another one (e.g. move all windows)
# If you use adhoc 1-window sessions, and you want to preserve session upon exit
# but don't want to create a lot of small unnamed 1-window sessions around
# move all windows from current session to main named one (dev, work, etc)
bind C-u command-prompt -p "Session to merge with: " \
   "run-shell 'yes | head -n #{session_windows} | xargs -I {} -n 1 tmux movew -t %%'"

# Detach from session
bind d detach
bind D if -F '#{session_many_attached}' \
    'confirm-before -p "Detach other clients? (y/n)" "detach -a"' \
    'display "Session has only 1 client attached"'

# Hide status bar on demand
bind C-s if -F '#{s/off//:status}' 'set status off' 'set status on'



# ==================================================
# === Window monitoring for activity and silence ===
# ==================================================
bind m setw monitor-activity \; display-message 'Monitor window activity [#{?monitor-activity,ON,OFF}]'
bind M if -F '#{monitor-silence}' \
    'setw monitor-silence 0 ; display-message "Monitor window silence [OFF]"' \
    'command-prompt -p "Monitor silence: interval (s)" "setw monitor-silence %%"'

# Activity bell and whistles
set -g visual-activity on

# TODO: Does not work as well, check on newer versions
# set -g visual-silence on

# BUG: bell-action other ignored · Issue #1027 · tmux/tmux · GitHub - https://github.com/tmux/tmux/issues/1027
# set -g visual-bell on
# setw -g bell-action other

# ================================================
# ===     Copy mode, scroll and clipboard      ===
# ================================================
set -g @copy_use_osc52_fallback on

# Prefer vi style key table
setw -g mode-keys vi

bind p paste-buffer
bind C-p choose-buffer

# trigger copy mode by (with vi keys, mouse copy mode switches window to emacs table)
bind -n M-Up setw -u mode-keys \; copy-mode

# Scroll up/down by 1 line, half screen, whole screen
bind -T copy-mode-vi M-Up              send-keys -X scroll-up
bind -T copy-mode-vi M-Down            send-keys -X scroll-down
bind -T copy-mode-vi M-PageUp          send-keys -X halfpage-up
bind -T copy-mode-vi M-PageDown        send-keys -X halfpage-down
bind -T copy-mode-vi PageDown          send-keys -X page-down
bind -T copy-mode-vi PageUp            send-keys -X page-up

# When scrolling with mouse wheel, reduce number of scrolled rows per tick to "2" (default is 5)
bind -T copy-mode-vi WheelUpPane       select-pane \; send-keys -X -N 2 scroll-up
bind -T copy-mode-vi WheelDownPane     select-pane \; send-keys -X -N 2 scroll-down

# wrap default shell in reattach-to-user-namespace if available
# there is some hack with `exec & reattach`, credits to "https://github.com/gpakosz/.tmux"
# don't really understand how it works, but at least window are not renamed to "reattach-to-user-namespace"
if -b "command -v reattach-to-user-namespace > /dev/null 2>&1" \
    "run 'tmux set -g default-command \"exec $(tmux show -gv default-shell) 2>/dev/null & reattach-to-user-namespace -l $(tmux show -gv default-shell)\"'"

yank="~/.tmux/yank.sh"

# Copy selected text
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "$yank"
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "$yank"
bind -T copy-mode-vi Y send-keys -X copy-line \;\
    run "tmux save-buffer - | $yank"
bind-key -T copy-mode-vi D send-keys -X copy-end-of-line \;\
    run "tmux save-buffer - | $yank"
bind -T copy-mode-vi C-j send-keys -X copy-pipe-and-cancel "$yank"
bind-key -T copy-mode-vi A send-keys -X append-selection-and-cancel \;\
    run "tmux save-buffer - | $yank"

# Word boundaries for double-click, same as Ghostty's default: paths, URLs, flags,
# emails, foo-bar.txt select as a single word.
# (tmux >= 3.3 default splits on every punctuation char, e.g. "/home/me" -> "home")
# Mouse selection bindings are at the very end, see "Mouse selection" section
set -g word-separators " '\"│`|:;,()[]{}<>$"

# iTerm2 works with clipboard out of the box, set-clipboard already set to "external"
# tmux show-options -g -s set-clipboard
# set-clipboard on|external

# Accept OSC 52 clipboard sequences from programs inside tmux (e.g. vim yank)
# and forward them to the outer terminal / system clipboard
set -g set-clipboard on
set -g allow-passthrough on
set -as terminal-features ',*:clipboard'

# =====================================
# ===           Theme               ===
# =====================================

# Feel free to NOT use this variables at all (remove, rename)
# this are named colors, just for convenience
color_orange="colour166" # 208, 166
color_purple="colour134" # 135, 134
color_green="colour076" # 070
color_blue="colour39"
color_yellow="colour220"
color_red="colour160"
color_black="colour232"
color_white="white" # 015

# This is a theme CONTRACT, you are required to define variables below
# Change values, but not remove/rename variables itself
color_dark="$color_black"
color_light="$color_white"
color_session_text="$color_blue"
color_status_text="colour245"
color_main="$color_orange"
color_secondary="$color_purple"
color_level_ok="$color_green"
color_level_warn="$color_yellow"
color_level_stress="$color_red"
color_window_off_indicator="colour088"
color_window_off_status_bg="colour238"
color_window_off_status_current_bg="colour254"
color_mode_prefix="$color_blue"
color_mode_copy="$color_yellow"
color_mode_sync="$color_red"

# Accent color follows the current mode: session badge, current window, active pane
# (in the status bar's pane list and its border). Keys off (F12) > prefix > copy > sync panes
mode_color="#{?#{==:#{client_key_table},off},$color_window_off_status_current_bg,#{?client_prefix,$color_mode_prefix,#{?pane_in_mode,$color_mode_copy,#{?pane_synchronized,$color_mode_sync,$color_main}}}}"
mode_label="#{?#{==:#{client_key_table},off}, OFF,#{?client_prefix, PREFIX,#{?pane_in_mode, COPY,#{?pane_synchronized, SYNC,}}}}"

# =====================================
# ===    Appearence and status bar  ===
# ======================================

set -g mode-style "fg=default,bg=$color_main"

# command line style
set -g message-style "fg=$color_main,bg=$color_dark"

# status line style
set -g status-style "fg=$color_status_text,bg=$color_dark"

# window segments in status line
set -g window-status-separator ""
separator_powerline_left=""
separator_powerline_right=""

# setw -g window-status-style "fg=$color_status_text,bg=$color_dark"
setw -g window-status-format " #I:#W "
setw -g window-status-current-style "fg=$color_light,bold,bg=$mode_color"
# Current window tab is hidden when it's the only window in the session
# (styles are split into #[fg=..]#[bg=..], a comma would end the #{?..} branch)
setw -g window-status-current-format "#{?#{==:#{session_windows},1},,#[fg=$color_dark]#[bg=$mode_color]$separator_powerline_right#[default] #I:#W #[fg=$mode_color]#[bg=$color_dark]$separator_powerline_right#[default]}"

# when window has monitoring notification
setw -g window-status-activity-style "fg=$color_main"

# outline for active pane
setw -g pane-active-border-style "fg=$mode_color"

# general status bar settings
set -g status on
set -g status-interval 5
set -g status-position top
set -g status-justify left
set -g status-left-length 150
set -g status-right-length 150

# define widgets we're going to use in status bar
# note, that this is not the complete list, some of them are loaded from plugins
wg_session="#[fg=$color_dark,bg=$mode_color,bold] #S$mode_label #[default]"
# Command running in each pane of the current window (e.g. "tail -f app.log"), the active
# one in a powerline arrow segment, like the current window tab. Command lines refresh every status-interval
wg_panes="#{P:#{?pane_active,#[fg=$color_dark]#[bg=$mode_color]$separator_powerline_right#[fg=$color_light]#[bold],#[fg=$color_status_text]} #{pane_index}:#(~/.tmux/pane_cmd.sh #{pane_tty} 30) #{?pane_active,#[fg=$mode_color]#[bg=$color_dark]#[nobold]$separator_powerline_right,}#[default]}"
# Separates the pane list from window tabs, when there are any (see window-status-current-format)
wg_windows_sep="#{?#{==:#{session_windows},1},,#[fg=$color_status_text]│#[default] }"
wg_battery="#{battery_status_fg} #{battery_icon} #{battery_percentage}"
wg_date="#[fg=$color_secondary]%Y-%m-%d %H:%M#[default]"
wg_user_host="#[fg=$color_secondary]#(whoami)#[default]@#H"
wg_is_zoomed="#[fg=$color_dark,bg=$color_secondary]#{?window_zoomed_flag,[Z],}#[default]"

set -g status-left "$wg_session $wg_panes $wg_windows_sep"
set -g status-right "$wg_is_zoomed #{sysstat_cpu} | #{sysstat_mem} | #{sysstat_swap} | $wg_date | $wg_user_host | $wg_battery #{online_status}"

# online and offline icon for tmux-online-status
set -g @online_icon "#[fg=$color_level_ok]●#[default]"
set -g @offline_icon "#[fg=$color_level_stress]●#[default]"

# Configure view templates for tmux-plugin-sysstat "MEM" and "CPU" widget
set -g @sysstat_mem_view_tmpl 'MEM:#[fg=#{mem.color}]#{mem.pused}#[default] #{mem.used}/#{mem.total}'
set -g @sysstat_swap_view_tmpl 'SWP:#[fg=#{swap.color}]#{swap.pused}#[default] #{swap.used}/#{swap.total}'

# Configure colors for tmux-plugin-sysstat "MEM" and "CPU" widget
set -g @sysstat_cpu_color_low "$color_level_ok"
set -g @sysstat_cpu_color_medium "$color_level_warn"
set -g @sysstat_cpu_color_stress "$color_level_stress"

set -g @sysstat_mem_color_low "$color_level_ok"
set -g @sysstat_mem_color_medium "$color_level_warn"
set -g @sysstat_mem_color_stress "$color_level_stress"

set -g @sysstat_swap_color_low "$color_level_ok"
set -g @sysstat_swap_color_medium "$color_level_warn"
set -g @sysstat_swap_color_stress "$color_level_stress"


# Configure tmux-battery widget colors
set -g @batt_color_full_charge "#[fg=$color_level_ok]"
set -g @batt_color_high_charge "#[fg=$color_level_ok]"
set -g @batt_color_medium_charge "#[fg=$color_level_warn]"
set -g @batt_color_low_charge "#[fg=$color_level_stress]"


# =====================================
# ===        Renew environment      ===
# =====================================
set -g update-environment \
  "DISPLAY\
  SSH_ASKPASS\
  SSH_AUTH_SOCK\
  SSH_AGENT_PID\
  SSH_CONNECTION\
  SSH_TTY\
  WINDOWID\
  XAUTHORITY"

bind '$' run "~/.tmux/renew_env.sh"


# ============================
# ===       Plugins        ===
# ============================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-online-status'
set -g @plugin 'tmux-plugins/tmux-sidebar'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'samoshkin/tmux-plugin-sysstat'

# Plugin properties
set -g @sidebar-tree 't'
set -g @sidebar-tree-focus 'T'
set -g @sidebar-tree-command 'tree -C'

set -g @open-S 'https://www.google.com/search?q='


# ==============================================
# ===   Nesting local and remote sessions     ===
# ==============================================

# Session is considered to be remote when we ssh into host
if-shell 'test -n "$SSH_CLIENT"' \
    'source-file ~/.tmux/tmux.remote.conf'

# We want to have single prefix key "C-a", usable both for local and remote session
# we don't want to "C-a" + "a" approach either
# Idea is to turn off all key bindings and prefix handling on local session,
# so that all keystrokes are passed to inner/remote session

# see: toggle on/off all keybindings · Issue #237 · tmux/tmux - https://github.com/tmux/tmux/issues/237

# Also, change some visual styles when window keys are off
bind -T root F12  \
    set prefix None \;\
    set key-table off \;\
    set status-style "fg=$color_status_text,bg=$color_window_off_status_bg" \;\
    set window-status-current-format "#{?#{==:#{session_windows},1},,#[fg=$color_window_off_status_bg]#[bg=$color_window_off_status_current_bg]$separator_powerline_right#[default] #I:#W #[fg=$color_window_off_status_current_bg]#[bg=$color_window_off_status_bg]$separator_powerline_right#[default]}" \;\
    set window-status-current-style "fg=$color_dark,bold,bg=$color_window_off_status_current_bg" \;\
    if -F '#{pane_in_mode}' 'send-keys -X cancel' \;\
    refresh-client -S \;\

bind -T off F12 \
  set -u prefix \;\
  set -u key-table \;\
  set -u status-style \;\
  set -u window-status-current-style \;\
  set -u window-status-current-format \;\
  refresh-client -S

# Run all plugins' scripts
run '~/.tmux/plugins/tpm/tpm'


# ==============================================
# ===          Mouse selection               ===
# ==============================================

# Must stay AFTER plugins are loaded: tmux-copycat rewraps every copy-mode binding
# containing "cancel" into `run-shell "tmux ..."`, which breaks { } blocks
# and loses the mouse target pane (drag would neither copy nor leave copy mode)

# Mouse selection that feels like Ghostty / iTerm2:
# - drag, double-click (word) and triple-click (line) copy, and put you right back
#   in the shell, so you can keep typing
# - when scrolled back, they copy but keep the highlight and the scroll position.
#   Typing anything then jumps back to the bottom and sends the key to the shell
#
# How: copy mode entered with the mouse (wheel, drag, clicks) switches the window to
# "mode-keys emacs", so keys are looked up in "copy-mode" table, which is rebuilt
# below for mouse use only. Keyboard copy mode (M-Up) keeps vi keys ("copy-mode-vi").
# Note: needs tmux >= 3.3 (SecondClick event, copy-pipe-no-clear)

# Back to vi keys as soon as pane leaves copy mode
set-hook -g pane-mode-changed 'if -F "#{?pane_in_mode,0,1}" "setw -u mode-keys"'

bind -T root WheelUpPane \
    if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" \
        { send-keys -M } \
        { setw mode-keys emacs ; copy-mode -e }
bind -T root MouseDrag1Pane \
    if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" \
        { send-keys -M } \
        { setw mode-keys emacs ; copy-mode -M }

# Double/triple-click copy right away but keep the highlight for a moment, then this
# leaves copy mode (copy-pipe-and-cancel would exit before the highlight is ever drawn).
# Run with -b so it doesn't block the command queue (the 3rd click of a triple click
# must still be handled). Skipped if the pane got scrolled back or left copy mode meanwhile
flash_cancel="if -t #{pane_id} -F '##{&&:##{pane_in_mode},##{?scroll_position,0,1}}' 'send-keys -t #{pane_id} -X cancel'"

# SecondClick fires right on the 2nd click. DoubleClick waits ~300ms to rule out
# a triple click, which makes copying a word feel slow
# "run -d 0.01" lets the pane redraw after entering copy mode before copying: tmux skips
# terminal output for a pane pending redraw, so the clipboard (OSC 52) would be dropped
unbind -T root DoubleClick1Pane
unbind -T copy-mode-vi DoubleClick1Pane
bind -T root SecondClick1Pane select-pane -t = \;\
    if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" \
        { send-keys -M } \
        { setw mode-keys emacs ; copy-mode -H ; send-keys -X select-word ; run -d 0.01 ; send-keys -X copy-pipe-no-clear "$yank" ; run -bC -d 0.1 "$flash_cancel" }
bind -T root TripleClick1Pane select-pane -t = \;\
    if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" \
        { send-keys -M } \
        { setw mode-keys emacs ; copy-mode -H ; send-keys -X select-line ; run -d 0.01 ; send-keys -X copy-pipe-no-clear "$yank" ; run -bC -d 0.1 "$flash_cancel" }

# Rebuild "copy-mode" table for mouse copy mode
unbind -a -T copy-mode
bind -T copy-mode WheelUpPane    select-pane \; send-keys -X -N 2 scroll-up
bind -T copy-mode WheelDownPane  select-pane \; send-keys -X -N 2 scroll-down
bind -T copy-mode MouseDrag1Pane select-pane \; send-keys -X begin-selection
bind -T copy-mode PageUp         send-keys -X page-up
bind -T copy-mode PageDown       send-keys -X page-down
bind -T copy-mode Escape         send-keys -X cancel
# M-Up/M-Down switch to keyboard copy mode (vi keys)
bind -T copy-mode M-Up           setw -u mode-keys \; send-keys -X scroll-up
bind -T copy-mode M-Down         setw -u mode-keys \; send-keys -X scroll-down
# Any typing key leaves copy mode and is sent to the shell
run '~/.tmux/mouse_copy_keys.sh'

# Same in both mouse and keyboard copy modes: copy, and leave copy mode unless scrolled back
bind -T copy-mode-vi MouseDragEnd1Pane \
    if -F "#{scroll_position}" \
        { send-keys -X copy-pipe-no-clear "$yank" } \
        { send-keys -X copy-pipe-and-cancel "$yank" }
bind -T copy-mode-vi SecondClick1Pane select-pane \;\
    send-keys -X select-word \;\
    send-keys -X copy-pipe-no-clear "$yank" \;\
    run -bC -d 0.1 "$flash_cancel"
bind -T copy-mode-vi TripleClick1Pane select-pane \;\
    send-keys -X select-line \;\
    send-keys -X copy-pipe-no-clear "$yank" \;\
    run -bC -d 0.1 "$flash_cancel"

bind -T copy-mode MouseDragEnd1Pane \
    if -F "#{scroll_position}" \
        { send-keys -X copy-pipe-no-clear "$yank" } \
        { send-keys -X copy-pipe-and-cancel "$yank" }
bind -T copy-mode SecondClick1Pane select-pane \;\
    send-keys -X select-word \;\
    send-keys -X copy-pipe-no-clear "$yank" \;\
    run -bC -d 0.1 "$flash_cancel"
bind -T copy-mode TripleClick1Pane select-pane \;\
    send-keys -X select-line \;\
    send-keys -X copy-pipe-no-clear "$yank" \;\
    run -bC -d 0.1 "$flash_cancel"

# Single click clears the highlight. If not scrolled back, also leave copy mode,
# so you're back at the live prompt (like clicking away a selection in a terminal)
bind -T copy-mode-vi MouseDown1Pane select-pane \;\
    if -F "#{scroll_position}" \
        "send-keys -X clear-selection" \
        "send-keys -X cancel"
bind -T copy-mode MouseDown1Pane select-pane \;\
    if -F "#{scroll_position}" \
        "send-keys -X clear-selection" \
        "send-keys -X cancel"
